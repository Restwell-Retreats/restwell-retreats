name: Theme PHP

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPCS security sniffs
        run: vendor/bin/phpcs --sniffs=WordPress.Security.EscapeOutput,WordPress.DB.PreparedSQL

  phpcs-extra:
    name: PHPCS Extra (report)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Report WordPress-Extra (does not fail the PR)
        run: vendor/bin/phpcs --report=summary

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPUnit
        run: vendor/bin/phpunit -c restwell-theme/phpunit.xml.dist
